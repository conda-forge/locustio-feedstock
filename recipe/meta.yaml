{% set name = "locustio" %}
{% set version = "1.5.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: locustio-{{ version }}.tar.gz
  url: https://github.com/locustio/locust/archive/{{ version }}.tar.gz
  sha256: 5e313951bb814741ff86742abc0b6e449956279defcbf7884d4cf3629d7ff2c9

build:
  number: 1
  noarch: python
  entry_points:
    - locust = locust.main:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - configargparse >=0.15.1
    - flask >=0.10.1
    - flask-basicauth
    - gevent >=1.5
    - geventhttpclient >=1.3.1
    - msgpack-python >=0.4.2
    - psutil
    - python >={{ python_min }}
    - pyzmq >=16.0.2
    - requests >=2.9.1
    - six >=1.10.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - locust
    - locust.contrib
  commands:
    - locust --help

about:
  home: https://locust.io/
  summary: Website load testing framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrisburr
